name: wow_chat
description: Multi-tenant, end-to-end encrypted, privacy-first messenger (Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # End-to-end encryption (Signal protocol: X3DH + Double Ratchet). Do NOT hand-roll crypto.
  libsignal_protocol_dart: ^0.7.1
  cryptography: ^2.7.0            # media/file encryption (XChaCha20-Poly1305 / AES-GCM)

  # Secure local storage
  flutter_secure_storage: ^9.2.2  # Keystore-backed key storage
  sqlcipher_flutter_libs: ^0.6.4  # encrypted SQLite
  drift: ^2.20.0                  # typed DB layer over SQLCipher
  path_provider: ^2.1.4

  # Calls
  flutter_webrtc: ^0.12.1

  # Privacy enforcement
  flutter_windowmanager_plus: ^1.0.1  # FLAG_SECURE (block screenshots/recents)

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Native stealth bridge (secret dial code / decoy) uses a platform channel — see android/.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

name: Android build

# Builds a debug APK so compile/interop errors surface automatically, and uploads the APK.
# The repo holds source (lib/, our android/ customizations) but not the generated Flutter
# scaffolding (gradle wrapper, build.gradle, mipmaps). `flutter create` fills those in without
# overwriting our committed files.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Force EVERY Android module (app + all plugins) to a single compileSdk/minSdk via a
      # Gradle init script. This avoids the common "plugin X requires compileSdk N" and
      # mismatched-SDK failures without editing generated (kts) gradle files. Applied globally
      # from ~/.gradle/init.d so the Flutter-invoked Gradle build picks it up.
      - name: Force unified Android SDK versions for all modules
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compileSdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      p.android {
                          compileSdkVersion 36
                          defaultConfig {
                              if (minSdkVersion == null || minSdkVersion.apiLevel < 24) {
                                  minSdkVersion 24
                              }
                          }
                      }
                  }
              }
          }
          EOF
          echo "init script written:"; cat ~/.gradle/init.d/compileSdk.gradle

      - name: Fill Flutter/Android scaffolding (keeps our files)
        run: flutter create --platforms=android --org com.wowchat --project-name wow_chat .

      - name: Remove default sample test (references non-existent MyApp)
        run: rm -f test/widget_test.dart

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=ci-placeholder \
            --dart-define=ACCESS_CODE=4729

      - uses: actions/upload-artifact@v4
        with:
          name: wow-todo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

      # Release APK. With no real keystore configured the Flutter template signs release with
      # the debug key, so it installs for testing. For production, add a keystore + key.properties
      # (see docs/BUILD.md) and CI secrets.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=ci-placeholder \
            --dart-define=ACCESS_CODE=4729

      - uses: actions/upload-artifact@v4
        with:
          name: wow-todo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
